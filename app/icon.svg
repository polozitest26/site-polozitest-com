<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 64 64" fill="none">
  <!-- Car body -->
  <rect x="8" y="28" width="48" height="18" rx="3" fill="#2563eb"/>

  <!-- Car roof -->
  <path d="M 18 28 L 22 18 L 42 18 L 46 28 Z" fill="#1d4ed8"/>

  <!-- Windows -->
  <rect x="20" y="20" width="10" height="7" rx="1" fill="#93c5fd" opacity="0.7"/>
  <rect x="34" y="20" width="10" height="7" rx="1" fill="#93c5fd" opacity="0.7"/>

  <!-- Wheels -->
  <circle cx="18" cy="46" r="6" fill="#1f2937"/>
  <circle cx="18" cy="46" r="3" fill="#6b7280"/>
  <circle cx="46" cy="46" r="6" fill="#1f2937"/>
  <circle cx="46" cy="46" r="3" fill="#6b7280"/>

  <!-- Headlight -->
  <circle cx="54" cy="36" r="2" fill="#fbbf24"/>

  <!-- Graduation cap on top -->
  <g transform="translate(28, 8)">
    <!-- Cap board -->
    <polygon points="4,4 12,2 20,4 12,6" fill="#10b981"/>
    <!-- Cap base -->
    <rect x="10" y="4" width="4" height="4" fill="#10b981"/>
    <!-- Tassel -->
    <line x1="20" y1="3" x2="22" y2="6" stroke="#10b981" stroke-width="0.5"/>
    <circle cx="22" cy="6.5" r="0.8" fill="#10b981"/>
  </g>
</svg>
